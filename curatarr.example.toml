# curatarr configuration
# Copy to curatarr.toml and adjust as needed.
# All values shown are defaults.
# Environment variables override file values using prefix CURATARR
# with __ as separator (e.g. CURATARR__SERVER__PORT=9090).

[server]
host = "0.0.0.0"
port = 8787

[database]
# backend: "sqlite" or "postgres"
backend = "sqlite"
url = "sqlite://curatarr.db?mode=rwc"
max_connections = 5

[library]
naming_template = "{Author}/{Series}/{SeriesPositionPadded} - {Title}.{Extension}"
# import_mode: "copy", "move", or "hardlink"
import_mode = "copy"
exclusions = ["*.tmp", ".DS_Store", "._*", "Thumbs.db"]
# Where curatarr stores covers (data_dir/covers) and the recycle bin (data_dir/recycle)
data_dir = "./data"
# Days a soft-deleted file is kept in the recycle bin before permanent removal
recycle_retention_days = 30

# Add root folders where your books are stored:
# [[library.root_folders]]
# path = "/path/to/books"
# name = "Main Library"
# content_types = ["book", "comic", "manga"]

[log]
level = "info"
# format: "pretty" or "json"
format = "pretty"
# file = "/var/log/curatarr/curatarr.log"

[metadata]
# Minimum fuzzy score (0.0-1.0) to auto-apply a search hit
match_threshold = 0.6
# 0 disables the background refresh loop
refresh_interval_hours = 0

# Keyless providers are on by default. Keyed providers stay off until api_key is set.
# [[metadata.providers]]
# name = "openlibrary"
# enabled = true
# priority = 10
# rate_limit_per_minute = 20
#
# [[metadata.providers]]
# name = "comicvine"
# enabled = true
# priority = 10
# api_key = "YOUR_KEY"
# rate_limit_per_minute = 200

[auth]
# Prefer CURATARR__AUTH__API_TOKEN or api_token_file so the token is not
# written into a Nix store TOML. serve refuses to start if the token is empty.
# api_token = ""
# api_token_file = "/run/credentials/curatarr.service/api_token"
# First-run admin (not stored in Nix-generated TOML):
# admin_credentials_file = "/run/credentials/curatarr.service/admin"

[acquire]
search_interval_minutes = 15
poll_interval_seconds = 10
# Acquisition starts when both URLs are set.
# prowlarr_url = "http://127.0.0.1:9696"
# prowlarr_api_key = ""
# nzbget_url = "http://127.0.0.1:6789/jsonrpc"
# nzbget_username = "nzbget"
# nzbget_password = ""
# nzbget_dest_dir = "/mnt/external/media/downloads/usenet/complete"
# ntfy_url = "https://ntfy.sh"
# ntfy_topic = ""

# Optional. Torrent releases are skipped unless this table is set.
# [download_clients.qbittorrent]
# url = "http://127.0.0.1:8080"
# username = "admin"
# password = ""
# save_path = ""
